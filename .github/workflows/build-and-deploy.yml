name: Build & Deploy InSnaps

on:
  push:
    branches: [insnaps]
    paths:
      - '_data/conflicts.json'
      - '_scripts/**'
      - 'build.sh'
      - '**.html'
      - '**.css'
      - '**.js'
  schedule:
    # Refresh the live news layer every 30 minutes. Runs that produce no
    # content change exit without committing (see the guard below).
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install Pillow

      - name: Run build script
        run: bash build.sh

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # t/index.html and products/gh-cache.json are also rewritten by build.sh.
          git add conflicts/ blog/ sitemap.xml insnaps_og.png t/index.html products/gh-cache.json _data/live/ _data/answers.json answers/ _content/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh live news layer, conflict pages, blog posts, and sitemap [$(date -u +'%Y-%m-%d %H:%MZ')]"
            git push
          fi
